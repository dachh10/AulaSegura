<script>
  (function () {
    const editBtn = document.getElementById('edit-name-btn');
    const nameDisplay = document.getElementById('student-name-display');
    const qrContainer = document.getElementById('qr-container');

    if (editBtn && nameDisplay) {
      editBtn.addEventListener('click', function () {
        const currentName = nameDisplay.textContent.trim();
        const updatedName = window.prompt('Corregir nombre del alumno:', currentName);
        if (updatedName && updatedName.trim().length > 0) {
          nameDisplay.textContent = updatedName.trim();
        }
      });
    }

    if (qrContainer) {
      let enlarged = false;
      qrContainer.addEventListener('click', function () {
        enlarged = !enlarged;
        qrContainer.classList.toggle('scale-105', enlarged);
        qrContainer.classList.toggle('shadow-md', enlarged);
      });
    }
  })();

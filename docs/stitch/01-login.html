<style>

      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;

      vertical-align: middle;

      background-image: radial-gradient(circle at 10% 20%, rgba(43, 47, 119, 0.03) 0%, transparent 40%),

<body class="bg-[#FBF8F3] text-on-surface antialiased min-h-screen flex justify-center items-start selection:bg-primary selection:text-white">
<!-- Android Shell Viewport (360x800 Baseline) -->
<main class="w-full max-w-[360px] min-h-[800px] bg-[#FBF8F3] relative flex flex-col justify-between overflow-x-hidden shadow-2xl custom-shield-bg">
<!-- TOP STACK (Zone 1 + Zone 2) -->
<div class="w-full">
<!-- ZONE 1: Header Section (Strictly 220px, No Overlap, No Omitir) -->
<header class="w-full h-[220px] bg-[#2B2F77] rounded-b-[40px] px-6 pt-3 pb-6 relative overflow-hidden flex flex-col justify-between select-none">
<!-- Subtle geometric shield watermark background at 6% white opacity -->
<div class="absolute inset-0 pointer-events-none opacity-[0.06] flex items-center justify-end -right-10 -bottom-8">
<svg fill="none" height="240" viewBox="0 0 100 115" width="220" xmlns="http://www.w3.org/2000/svg">
<path d="M50 5L90 22V55C90 82 72 105 50 112C28 105 10 82 10 55V22L50 5Z" fill="none" stroke="#FFFFFF" stroke-linejoin="round" stroke-width="6"></path>
<path d="M35 55L45 66L65 44" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round" stroke-width="6"></path>
</svg>
</div>
<!-- Android Status Bar (Time, Icons) -->
<div class="w-full flex items-center justify-between text-white/90 text-xs font-data-mono-sm tracking-tight relative z-10 pt-1">
<span class="font-medium tracking-normal text-[13px]">09:41</span>
<div class="flex items-center space-x-1.5 opacity-90">
<span class="material-symbols-outlined !text-[14px]">wifi</span>
<span class="material-symbols-outlined !text-[14px]">signal_cellular_alt</span>
<span class="material-symbols-outlined !text-[16px]">battery_full</span>
</div>
</div>
<!-- Shield Icon & Identity (24px below status bar) -->
<div class="relative z-10 flex flex-col justify-end mt-2">
<!-- Small white shield logo container (44px) -->
<div class="w-11 h-11 rounded-2xl bg-white/10 backdrop-blur-sm border border-white/20 flex items-center justify-center text-white mb-5 shadow-sm">
<svg fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewBox="0 0 24 24" width="24">
<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
<path d="m9 12 2 2 4-4"></path>
</svg>
</div>
<!-- Title & Subtitle -->
<h1 class="text-white font-display-lg text-[32px] leading-[36px] font-bold tracking-[-0.02em]">
            Hola de nuevo
          </h1>
<p class="text-white/75 font-body-md text-[14px] leading-5 mt-1">
            Inicia sesión para continuar
          </p>
</div>
</header>
<!-- ZONE 2: Body Section (Starts exactly 24px below header, no negative margin, px-4) -->
<section class="mt-6 px-4">
<!-- White Card Container (rounded-[24px], border 1px #E6E1D8, p-5, space-y-4) -->
<div class="bg-surface-container-lowest border border-[#E6E1D8] rounded-[24px] p-5 space-y-4 shadow-[0_2px_12px_rgba(27,29,58,0.03)]">
<!-- Input Group 1: Correo electrónico -->
<div class="space-y-1.5">
<label class="block font-body-md text-[13px] font-medium text-on-surface" for="email">
              Correo electrónico
            </label>
<div class="relative flex items-center">
<span class="absolute left-3.5 text-outline pointer-events-none material-symbols-outlined !text-[20px]">
                mail
              </span>
<input class="w-full h-[50px] pl-11 pr-4 bg-[#F6F3EE] border border-[#E6E1D8] rounded-[16px] text-[14px] font-body-md text-on-surface placeholder:text-outline/70 focus:bg-white focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all duration-200" id="email" name="email" placeholder="correo@ejemplo.com" type="email">
</div>
</div>
<!-- Input Group 2: Contraseña -->
<div class="space-y-1.5">
<label class="block font-body-md text-[13px] font-medium text-on-surface" for="password">
              Contraseña
            </label>
<div class="relative flex items-center">
<span class="absolute left-3.5 text-outline pointer-events-none material-symbols-outlined !text-[20px]">
                lock
              </span>
<input class="w-full h-[50px] pl-11 pr-11 bg-[#F6F3EE] border border-[#E6E1D8] rounded-[16px] text-[14px] font-body-md text-on-surface placeholder:text-outline/70 focus:bg-white focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container tracking-wider transition-all duration-200" id="password" name="password" placeholder="••••••••" type="password">
<button aria-label="Mostrar u ocultar contraseña" class="absolute right-3.5 text-outline hover:text-on-surface transition-colors p-1 flex items-center justify-center" onclick="const pass = document.getElementById('password'); const icon = this.querySelector('span'); if(pass.type === 'password'){ pass.type = 'text'; icon.textContent = 'visibility_off'; } else { pass.type = 'password'; icon.textContent = 'visibility'; }" type="button">
<span class="material-symbols-outlined !text-[20px]">visibility</span>
</button>
</div>
</div>
<!-- Right-aligned Link: ¿Olvidaste tu contraseña? -->
<div class="flex justify-end pt-0.5">
<a class="text-[#FF6B57] font-body-md text-[13px] font-medium hover:underline hover:opacity-90 transition-opacity" href="#recuperar">
              ¿Olvidaste tu contraseña?
            </a>
</div>
<!-- Full-Width Primary Pill Button: Iniciar sesión -->
<div class="pt-1">
<button class="w-full h-[48px] bg-[#FF6B57] hover:bg-[#fa5b45] active:scale-[0.98] text-white font-body-md font-semibold text-[15px] rounded-full flex items-center justify-center transition-all duration-150 shadow-md shadow-[#FF6B57]/25" type="button">
              Iniciar sesión
            </button>
</div>
</div>
<!-- BELOW THE CARD: Separator and Google Button -->
<div class="mt-5 space-y-4">
<!-- Divider with "o" -->
<div class="relative flex items-center justify-center">
<div class="w-full border-t border-[#E6E1D8]"></div>
<span class="absolute bg-[#FBF8F3] px-3 font-body-md text-[13px] text-outline">
              o
            </span>
</div>
<!-- Google Pill Button -->
<button class="w-full h-[48px] bg-white border-[1.5px] border-[#2B2F77] hover:bg-[#F6F3EE] active:scale-[0.98] rounded-full flex items-center justify-center gap-3 transition-all duration-150 shadow-sm" type="button">
<!-- Google Multicolored Logo SVG -->
<svg class="w-4 h-4 flex-shrink-0" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"></path>
</svg>
<span class="text-[#2B2F77] font-body-md font-semibold text-[14px]">
              Continuar con Google
            </span>
</button>
</div>
</section>
</div>
<!-- BOTTOM OF THE SCREEN: Sign-up Hint & Institutional Note -->
<footer class="w-full px-5 pb-4 pt-6 text-center select-none flex flex-col items-center">
<!-- Parents Registration Link -->
<div class="font-body-md text-[13px] text-on-surface-variant flex items-center justify-center gap-1 flex-wrap"><span>¿No tienes cuenta?</span><a class="text-[#FF6B57] font-semibold hover:underline transition-all" href="#registro">Regístrate como tutor o docente</a></div>
<!-- Institutional Staff Note with Lock Icon -->
<div class="mt-2.5 flex items-center justify-center gap-1.5 text-outline text-[12px] font-body-md max-w-[290px] leading-tight">
<span class="material-symbols-outlined !text-[14px] text-outline flex-shrink-0" style="font-variation-settings: 'FILL' 1;">
          lock
        </span>
<span class="text-center">
          Docentes y administradores reciben su acceso del plantel.
        </span>
</div>
<!-- Android Home Bar Gesture Indicator -->
<div class="w-full flex justify-center pt-5 pb-1">
<div class="w-32 h-1 bg-[#1C1C19]/25 rounded-full"></div>
</div>
</footer>
</main>


</body></html>

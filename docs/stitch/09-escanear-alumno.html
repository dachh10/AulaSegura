<script>
  (function initScannerLaser() {
    const laser = document.getElementById('scan-laser');
    if (!laser) return;
    let pos = 12;
    let direction = 1;
    const minPos = 12;
    const maxPos = 244;

    function step() {
      pos += direction * 2.2;
      if (pos >= maxPos) {
        pos = maxPos;
        direction = -1;
      } else if (pos <= minPos) {
        pos = minPos;
        direction = 1;
      }
      laser.style.top = pos + 'px';
      requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();
